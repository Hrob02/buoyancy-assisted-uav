flight_controller:
  ros__parameters:
    publish_rate_hz: 10.0
    takeoff_altitude_m: 4.0
    altitude_tolerance_m: 0.25
    kp: 0.22
    ki: 0.06
    kd: 0.12
    base_hover_throttle: 0.46
    min_throttle: 0.0
    max_throttle: 1.0
    integral_limit: 6.0
    mission_hold_time_s: 4.0
    mission_route_m: [5.5, 3.0, 6.0, 2.5]

sensor_publisher:
  ros__parameters:
    publish_rate_hz: 50.0

gazebo_state_bridge:
  ros__parameters:
    entity_name: crazyflie_visual
    fixed_x_m: 0.0
    fixed_y_m: 0.0
    xy_motion_enabled: true
    xy_motion_start_delay_s: 3.0
    xy_motion_duration_s: 24.0
    xy_motion_radius_m: 2.0
    xy_motion_period_s: 12.0
    xy_motion_y_scale: 0.7

rviz_visualization:
  ros__parameters:
    world_frame: map
    uav_frame: crazyflie_visual
    fixed_x_m: 0.0
    fixed_y_m: 0.0
    xy_motion_enabled: true
    xy_motion_start_delay_s: 3.0
    xy_motion_duration_s: 24.0
    xy_motion_radius_m: 2.0
    xy_motion_period_s: 12.0
    xy_motion_y_scale: 0.7
    marker_scale_m: 0.25
